<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CmdImpact</title>
  <desc id="desc">Paste a command and spot common risks before running it.</desc>
  <rect width="1200" height="630" fill="#f5f0e8"/>
  <circle cx="104" cy="82" r="220" fill="#ffb000" opacity=".18"/>
  <path d="M0 520 1200 270" stroke="#d7cbbc" stroke-width="2"/>
  <g transform="translate(80 70)"><rect width="62" height="62" rx="17" fill="#17191c"/><path d="m15 18 17 13-17 13M38 44h12" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"/><path d="m15 18 17 13-17 13" stroke="#ffb000"/><path d="M38 44h12" stroke="#f6f4ed"/><text x="80" y="45" fill="#181512" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="850" letter-spacing="-2"><tspan font-family="Consolas,monospace" font-weight="700">cmd</tspan>impact</text></g>
  <text x="80" y="270" fill="#181512" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="850" letter-spacing="-4">Spot common command risks</text>
  <text x="80" y="352" fill="#3f49d8" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="850" letter-spacing="-4">before you run it.</text>
  <g transform="translate(80 430)"><rect width="1040" height="120" rx="22" fill="#17191c"/><circle cx="30" cy="26" r="6" fill="#ff705f"/><circle cx="49" cy="26" r="6" fill="#f5be4f"/><circle cx="68" cy="26" r="6" fill="#58c978"/><text x="30" y="82" fill="#ffb000" font-family="Consolas,monospace" font-size="27">&gt;</text><text x="63" y="82" fill="#f6f4ed" font-family="Consolas,monospace" font-size="27">paste command</text><text x="800" y="82" fill="#8d949e" font-family="Consolas,monospace" font-size="20">nothing executes</text></g>
</svg>
